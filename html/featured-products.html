<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Featured Products | __SITE__</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/products.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="catalog-shell">
    <header class="catalog-banner">
      <div class="banner-left" aria-hidden="true"></div>

      <div class="banner-center">
        <h1>Featured Products</h1>
        <span class="catalog-kicker">All Handmade Treasures</span>
      </div>

      <div class="banner-right">
        <p id="featuredProductsCount" class="catalog-count">Loading products...</p>
      </div>
    </header>

    <div class="catalog-layout">
      <aside id="featuredFilterSidebar" class="filter-sidebar" aria-label="Filter and sort featured products">
        <div class="sidebar-top">
          <h2>Refine Search</h2>
          <button type="button" id="fpResetBtn" class="btn-reset-link">Reset all</button>
        </div>

        <div class="field-block">
          <label for="fpKeywordInput">Keyword or Tag</label>
          <input
            type="search"
            id="fpKeywordInput"
            placeholder="Sunflower, candle, cake..."
          >
        </div>

        <div class="field-block">
          <label for="fpCategorySelect">Category</label>
          <select id="fpCategorySelect">
            <option value="">All Categories</option>
          </select>
        </div>

        <div class="field-block">
          <label for="fpSubcategorySelect">Subcategory</label>
          <select id="fpSubcategorySelect">
            <option value="">All Subcategories</option>
          </select>
        </div>

        <div class="field-block">
          <label>Price Range (PKR)</label>
          <div class="price-pair">
            <input type="number" id="fpMinPrice" min="0" step="50" placeholder="Min">
            <span class="price-dash">–</span>
            <input type="number" id="fpMaxPrice" min="0" step="50" placeholder="Max">
          </div>
        </div>

        <div class="field-block">
          <label for="fpCitySelect">Deliverable City</label>
          <select id="fpCitySelect">
            <option value="">Any City</option>
          </select>
        </div>

        <div class="field-block">
          <label for="fpSortSelect">Sort By</label>
          <select id="fpSortSelect">
            <option value="newest">Newest</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
          </select>
        </div>
      </aside>

      <section id="featuredProductsGrid" class="catalog-grid" aria-live="polite"></section>
    </div>
  </main>

  <div id="footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/catalog.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/featured-products.js"></script>
  <script src="../js/member2-helpers.js"></script>
</body>
</html>
