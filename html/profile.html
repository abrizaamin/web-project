<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My profile | __SITE__</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="profile-wrap">
    <section class="profile-head">
      <div class="avatar" id="pInitial">A</div>
      <div>
        <h1 id="pName"></h1>
        <p id="pEmail"></p>
        <span class="role-badge" id="pRole"></span>
      </div>
    </section>

    <section class="panel">
      <h2>Account details</h2>
      <form id="nameForm" class="inline-form">
        <input type="text" id="editName" aria-label="Full name" required>
        <button type="submit" class="btn-sm">Save name</button>
      </form>
    </section>

    <section class="panel">
      <h2>Saved addresses</h2>
      <div id="addressList" class="addr-grid"></div>
      <form id="addrForm" class="form-grid">
        <input type="text" id="aLabel" placeholder="Label (Home, Office)" required>
        <input type="text" id="aPhone" placeholder="Phone (03xx xxxxxxx)" required>
        <input type="text" id="aStreet" class="full" placeholder="Street address" required>
        <select id="aCity" aria-label="City"></select>
        <button type="submit" class="btn-sm">Add address</button>
      </form>
    </section>
  </main>

  <div id="footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
