<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Featured Shops | __SITE__</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/products.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="catalog-shell">
    <header class="catalog-banner">
      <div class="banner-left" aria-hidden="true"></div>

      <div class="banner-center">
        <h1>Featured Shops</h1>
        <span class="catalog-kicker">Small-Batch Pakistani Makers</span>
      </div>

      <div class="banner-right">
        <p id="productsCountText" class="catalog-count">Loading shops...</p>
      </div>
    </header>

    <nav id="quickCategoryPills" class="quick-pills" aria-label="Quick category filter"></nav>

    <section id="shopsDirectoryView" class="shops-stage" aria-label="Maker shops">
      <div id="shopsGrid" class="shops-grid" aria-live="polite"></div>
    </section>

    <section id="shopProductsView" class="shop-products-stage" hidden>
      <div class="selected-shop-bar">
        <div>
          <span class="selected-shop-kicker">Selected Shop</span>
          <h2 id="selectedShopHeading" class="selected-shop-title"></h2>
        </div>
        <button type="button" id="backToShopsBtn" class="btn-back-shops">← All Shops</button>
      </div>

      <div class="catalog-layout">
        <aside id="filterSidebar" class="filter-sidebar" aria-label="Filter and sort shop products">
          <div class="sidebar-top">
            <h2>Refine Search</h2>
            <button type="button" id="resetFiltersBtn" class="btn-reset-link">Reset all</button>
          </div>

          <div class="field-block">
            <label for="productSearchInput">Keyword or Tag</label>
            <input
              type="search"
              id="productSearchInput"
              placeholder="Sunflower, candle, cake..."
            >
          </div>

          <div class="field-block">
            <label for="subcategoryFilter">Subcategory</label>
            <select id="subcategoryFilter">
              <option value="">All Subcategories</option>
            </select>
          </div>

          <div class="field-block">
            <label>Price Range (PKR)</label>
            <div class="price-pair">
              <input type="number" id="minPriceFilter" min="0" step="50" placeholder="Min">
              <span class="price-dash">–</span>
              <input type="number" id="maxPriceFilter" min="0" step="50" placeholder="Max">
            </div>
          </div>

          <div class="field-block">
            <label for="cityFilter">Deliverable City</label>
            <select id="cityFilter">
              <option value="">Any City</option>
            </select>
          </div>

          <div class="field-block">
            <label for="sortSelect">Sort By</label>
            <select id="sortSelect">
              <option value="newest">Newest</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
            </select>
          </div>
        </aside>

        <section id="productsGrid" class="catalog-grid" aria-live="polite"></section>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/catalog.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/featured-shops.js"></script>
  <script src="../js/member2-helpers.js"></script>
</body>
</html>
